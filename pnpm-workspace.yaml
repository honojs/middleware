packages:
  - 'packages/*'
  - '.github/actions/*'

allowBuilds:
  '@clerk/shared': false
  esbuild: false
  msw: false
  protobufjs: false
  re2: false
  sharp: false
  unrs-resolver: false
  workerd: false
catalog:
  '@types/node': ^25.2.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  '@vitest/coverage-istanbul': 5.0.1
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  '@types/node': 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
resolvePeersFromWorkspaceRoot: true
