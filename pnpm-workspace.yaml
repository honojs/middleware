packages:
  - 'packages/*'
  - '.github/actions/*'

allowBuilds:
  '@clerk/shared': false
  esbuild: false
  msw: false
  protobufjs: false
  re2: false
  sharp: false
  unrs-resolver: false
  workerd: false
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1
  '@types/node': ^25.2.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
resolvePeersFromWorkspaceRoot: true
