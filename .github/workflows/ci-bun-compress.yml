name: ci-bun-compress
on:
  push:
    branches: [main]
    paths:
      - 'packages/bun-compress/**'
  pull_request:
    branches: ['*']
    paths:
      - 'packages/bun-compress/**'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: [1.3.2, 1.3.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - run: pnpm install --filter @hono/bun-compress
      - run: pnpm turbo --filter @hono/bun-compress build
      - run: bun test packages/bun-compress --coverage --coverage-reporter lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          fail_ci_if_error: true
          directory: ./coverage
          flags: bun-compress
